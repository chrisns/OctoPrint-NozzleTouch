[build-system]
requires = ["setuptools>=64", "wheel", "OctoPrint"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-NozzleTouch"
version = "0.1.0"
description = "Levels the bed of a Snapmaker 2.0 dual extruder by touching the plate with the cold nozzle, and sets the T1 height."
readme = "README.md"
requires-python = ">=3.7,<4"
license = { text = "MIT" }
authors = [{ name = "Chris Nesbitt-Smith", email = "chris@cns.me.uk" }]
keywords = ["octoprint", "plugin", "bed levelling", "mesh", "calibration", "snapmaker", "dual extruder"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: OctoPrint",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/chrisns/OctoPrint-NozzleTouch"
Source = "https://github.com/chrisns/OctoPrint-NozzleTouch"
Issues = "https://github.com/chrisns/OctoPrint-NozzleTouch/issues"

[project.entry-points."octoprint.plugin"]
nozzletouch = "octoprint_nozzletouch"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = ["octoprint_nozzletouch", "octoprint_nozzletouch.*"]

[tool.setuptools.package-data]
octoprint_nozzletouch = ["templates/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
